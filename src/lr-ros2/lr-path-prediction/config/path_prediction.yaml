canonical_prediction_visualizer:
  ros__parameters:
    input.trajectory_topic: /trajectory
    input.path_snapshot_topic: /trajectory/path
    input.geometry_topic: /geometry
    input.prediction_topic: /predict_output
    output.steps_topic: /lr/path_prediction/steps
    output.markers_topic: /lr/path_prediction/markers
    output.reference_path_topic: /lr/path_prediction/reference_path
    frames.map_frame: map
    # Display policy: minimum valid normalized SSM / stability moment / ZMP.
    warning.rollover_normalized_margin: 0.20
    critical.rollover_normalized_margin: 0.0
    warning.slope_deg: 20.0
    critical.slope_deg: 30.0
    visualization.normal_length_m: 0.8
    visualization.max_prediction_age_sec: 1.0
    visualization.max_path_age_sec: 1.5
    visualization.max_geometry_age_sec: 2.0
    visualization.label_height_m: 0.45
    visualization.collision_warning_height_m: 1.0
    visualization.collision_warning_triangle_size_m: 0.9
    visualization.collision_warning_line_width_m: 0.08
    visualization.collision_warning_symbol_scale_m: 0.60
