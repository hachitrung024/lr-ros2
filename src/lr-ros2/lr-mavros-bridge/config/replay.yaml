    use_sim_time: true
    plugin_allowlist: [command, sys_status, global_position, imu, lr_replay_time]
    target_system_id: 1
    target_component_id: 1
/**/sys:
  ros__parameters:
    heartbeat_rate: 1.0
    conn_timeout: 3.0
/**/global_position:
