segmentation:
  ros__parameters:
    input.image_topic: /zed/zed_node/rgb/color/rect/image
    model.path: ""
    model.device: "0"
    model.confidence: 0.25
    model.image_size: 960
    model.iou: 0.60

box_estimator_3d:
  ros__parameters:
    input.mask_topic: /segmentation/instance_mask
    input.depth_topic: /zed/zed_node/depth/depth_registered
    input.camera_info_topic: /zed/zed_node/rgb/color/rect/camera_info
    output.box_topic: /segmentation/boxes_3d
    output.marker_topic: /segmentation/box_markers
    output.frame_id: map
    geometry.up_axis: [0.0, 0.0, 1.0]
    sync_tolerance_sec: 0.05
    sync_buffer.max_samples: 30
    sync_buffer.max_age_sec: 1.0
    minimum_depth_m: 0.2
    maximum_depth_m: 20.0
    sampling_stride: 2
    maximum_points_per_instance: 15000
    minimum_points_per_instance: 64
    depth_mad_scale: 8.0
    minimum_depth_band_m: 0.15
    box.trim_fraction: 0.02
    box.minimum_size_m: 0.05
    visualization.box_line_width_m: 0.07
    visualization.box_fill_alpha: 0.12
    visualization.label_scale_m: 0.28
    tracking.association_distance_m: 1.0
    tracking.max_missed_frames: 5
    tracking.min_confirmations: 2
    tracking.measurement_stddev_m: 0.08
    tracking.acceleration_stddev_mps2: 1.0
    tracking.size_smoothing: 0.35
    tracking.orientation_smoothing: 0.35
